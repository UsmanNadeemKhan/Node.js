version: "3.8"
services:
  mongo:
    image: mongo:6
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    build: ./BackEnd
    container_name: backend-1
    ports:
      - "5000:5000"
    depends_on:
      - mongo
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/airportdb

  frontend:
    build: ./FrontEnd
    container_name: frontend-1
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  mongo-data:
